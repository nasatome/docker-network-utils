services:
  traefik:
    image: traefik:v3.7.11
    restart: always
    command:
      # Logging
      - "--log.level=${TRAEFIK_LOG_LEVEL}"

      # Access log. Off by default: it is high volume and where it should go
      # depends entirely on the host, so opting in is the deployer's decision.
      #
      # filePath is set unconditionally, and that is deliberate. With the access
      # log enabled and no filePath, Traefik writes it to stdout — which means
      # it lands in whatever log driver the container uses. On a host shipping
      # container output to a paid log service that silently multiplies the
      # bill. Verified against traefik:v3.7.11: --accesslog=false disables the
      # access log even with filePath set, so the flag pair is safe to leave in
      # place permanently.
      #
      # Traefik has NO built-in rotation for the access log — maxSize, maxAge
      # and maxBackups exist only for --log, not --accesslog. Rotation is the
      # host's job. Traefik closes and reopens its log files on USR1, so an
      # external rotator must rename the file and then signal the container;
      # truncate-in-place loses whatever is written during the copy window.
      # Verified with traefik:v3.7.11: after a rename the process keeps writing
      # to the old inode until USR1 arrives, and the signal does not restart it.
      - "--accesslog=${TRAEFIK_ACCESS_LOG:-false}"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=${TRAEFIK_ACCESS_LOG_FORMAT:-json}"

      # Ping endpoint for health checks
      - "--ping=${TRAEFIK_PING}"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.watch=true"
      - "--providers.docker.network=${TRAEFIK_DEFAULT_DOCKER_NETWORK}"

      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "--entrypoints.websecure.forwardedheaders.insecure=false"
      - "--entrypoints.websecure.forwardedheaders.trustedips=${CLOUDFLARE_IPS}"

      # ACME DNS challenge (Cloudflare) - Traefik v3 syntax
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.dnschallenge=true"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.dnschallenge.provider=${TRAEFIK_DNS_PROVIDER}"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.dnschallenge.propagation.delaybeforechecks=${TRAEFIK_DNS_DELAY_BEFORE_CHECK}"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.dnschallenge.propagation.disableanschecks=true"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.storage=/etc/traefik/acme/acme.json"

      # API/Dashboard (secured via labels below)
      - "--api=${TRAEFIK_API}"
      - "--api.dashboard=${TRAEFIK_API_DASHBOARD}"

    networks:
      - traefik
    ports:
      - "${TRAEFIK_HOST_HTTP_PORT}:80"
      - "${TRAEFIK_HOST_HTTPS_PORT}:443"
    volumes:
      - ${DOCKER_SOCK_PATH}:/var/run/docker.sock:ro

      # create_host_path: false on both persistent mounts below. Docker's default
      # is to silently create a missing bind source, which is the wrong default
      # for state that must already exist. On a host where these paths live on a
      # separate disk, a boot where that disk fails to mount would have Docker
      # invent empty directories on the root filesystem and Traefik happily use
      # them: certificates reissued from scratch against the CA's rate limits,
      # access log written somewhere nobody will look, and the real data hidden
      # under the mount once it appears. Refusing to start is the safe failure —
      # loud, immediate, and it cannot corrupt anything.
      #
      # Both directories are tracked with a .gitkeep so a fresh clone still runs.
      - type: bind
        source: ./acme
        target: /etc/traefik/acme
        bind:
          create_host_path: false

      # The DIRECTORY is mounted, never the log file itself. A single-file bind
      # mount binds the inode: when the rotator renames the file and creates a
      # new one, the host gets a fresh inode but the container keeps writing to
      # the old one, invisibly, forever. Mounting the directory makes rename and
      # create immediately visible on both sides.
      - type: bind
        source: ${TRAEFIK_LOG_DIR:-./logs}
        target: /var/log/traefik
        bind:
          create_host_path: false
    env_file:
      - ./.${TRAEFIK_DNS_PROVIDER}-api.key
    labels:
      - "traefik.enable=true"
      # Dashboard secure mode: route to api@internal with basicAuth
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_FRONTEND_RULE}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      # Traefik v3 fix: explicit certresolver per-router required, entrypoint
      # default cert resolver does NOT propagate to routers with `tls=true`
      # alone (router gets `tls={}` empty config, which serves default cert
      # instead of triggering ACME order). Discovered debugging fresh deploy.
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS}"

  # ==========================================================================
  # Ofelia - Docker Job Scheduler
  # Updates Cloudflare IP ranges weekly
  # @see https://github.com/mcuadros/ofelia
  # ==========================================================================
  ofelia:
    image: mcuadros/ofelia:latest
    restart: always
    depends_on:
      - traefik
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ${DOCKER_SOCK_PATH}:/var/run/docker.sock:ro
      - ./ofelia.ini:/etc/ofelia/config.ini:ro
    command: daemon --config=/etc/ofelia/config.ini

networks:
  traefik:
    driver: bridge
